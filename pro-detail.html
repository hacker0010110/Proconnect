<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Pro — ProConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .pro-detail-header { background: linear-gradient(135deg, rgba(124, 58, 237, 0.15), rgba(6, 182, 212, 0.15)); border: 1px solid var(--border); border-radius: 24px; padding: 40px; display: flex; gap: 30px; align-items: center; margin-bottom: 32px; flex-wrap: wrap; }
    .pro-detail-avatar { width: 140px; height: 140px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--cyan)); display: flex; align-items: center; justify-content: center; font-size: 60px; font-weight: 800; color: white; flex-shrink: 0; }
    .pro-detail-info { flex: 1; min-width: 260px; }
    .pro-detail-name { font-size: 36px; font-weight: 800; margin-bottom: 8px; }
    .pro-detail-meta { display: flex; gap: 20px; flex-wrap: wrap; color: var(--text-secondary); margin-bottom: 16px; }
    .pro-detail-stats { display: flex; gap: 24px; flex-wrap: wrap; }
    .pro-stat { text-align: center; padding: 12px 20px; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); }
    .pro-stat-value { font-size: 24px; font-weight: 800; color: var(--primary-light); }
    .pro-stat-label { font-size: 12px; color: var(--text-secondary); }
    .section-block { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
    .review-card { background: var(--bg-surface); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .review-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .stars { color: var(--orange); }
  </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo" onclick="location.href='index.html'">ProConnect</div>
        <div class="nav-links" id="navLinks"></div>
      </nav>

  <main class="main">
    <div id="content">Chargement...</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    async function loadPro() {
      const id = new URLSearchParams(window.location.search).get('id');
      if (!id) { window.location.href = 'professionals.html'; return; }

      const { data: pro } = await db.from('professionals').select('*').eq('id', id).single();
      if (!pro) { document.getElementById('content').innerHTML = 'Pro introuvable'; return; }

      const { data: reviews } = await db.from('reviews').select('*').eq('professional_id', id).order('created_at', { ascending: false });

      const stars = (n) => '★'.repeat(Math.floor(n)) + '☆'.repeat(5 - Math.floor(n));

      document.getElementById('content').innerHTML = `
    
        
        <div class="pro-detail-header fade-in">
          <div class="pro-detail-avatar">${pro.name[0].toUpperCase()}</div>
          <div class="pro-detail-info">
            <h1 class="pro-detail-name">${pro.name}</h1>
            <div class="pro-detail-meta">
              <span><i class="fa-solid fa-briefcase"></i> ${pro.job}</span>
              <span><i class="fa-solid fa-location-dot"></i> ${pro.city}</span>
              ${pro.years_experience ? `<span><i class="fa-solid fa-clock"></i> ${pro.years_experience} ans d'expérience</span>` : ''}
            </div>
            <div class="pro-detail-stats">
              <div class="pro-stat">
                <div class="pro-stat-value">${pro.rating || '0.0'}</div>
                <div class="pro-stat-label">⭐ Note</div>
              </div>
              <div class="pro-stat">
                <div class="pro-stat-value">${pro.review_count || 0}</div>
                <div class="pro-stat-label">Avis</div>
              </div>
              ${pro.price_per_hour ? `
                <div class="pro-stat">
                  <div class="pro-stat-value">${pro.price_per_hour}</div>
                  <div class="pro-stat-label">DA/heure</div>
                </div>
              ` : ''}
            </div>
          </div>
          <a href="booking.html?id=${pro.id}&name=${encodeURIComponent(pro.name)}&job=${encodeURIComponent(pro.job)}" class="btn btn-primary" style="font-size: 16px; padding: 16px 32px;">
            <i class="fa-solid fa-calendar-plus"></i> Réserver maintenant
          </a>
        </div>

        ${pro.description ? `
          <div class="section-block">
            <h2 style="margin-bottom: 12px;">📝 À propos</h2>
            <p style="color: var(--text-secondary); line-height: 1.7;">${pro.description}</p>
          </div>
        ` : ''}

        ${pro.specialties && pro.specialties.length ? `
          <div class="section-block">
            <h2 style="margin-bottom: 12px;">⭐ Spécialités</h2>
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
              ${pro.specialties.map(s => `<span style="background: rgba(124,58,237,0.15); color: var(--primary-light); padding: 6px 14px; border-radius: 100px; font-size: 14px;">${s}</span>`).join('')}
            </div>
          </div>
        ` : ''}

        <div class="section-block">
          <h2 style="margin-bottom: 16px;">💬 Avis (${reviews?.length || 0})</h2>
          ${!reviews || reviews.length === 0 ? `
            <p style="color: var(--text-muted); text-align: center; padding: 20px;">Aucun avis pour le moment</p>
          ` : reviews.map(r => `
            <div class="review-card">
              <div class="review-header">
                <strong>${r.client_name}</strong>
                <span class="stars">${stars(r.rating)}</span>
              </div>
              <p style="color: var(--text-secondary); font-size: 14px;">${r.comment}</p>
              <p style="font-size: 12px; color: var(--text-muted); margin-top: 6px;">${new Date(r.created_at).toLocaleDateString('fr-FR')}</p>
            </div>
          `).join('')}
        </div>
      `;
    }

    loadPro();
  </script>
</body>
</html>
