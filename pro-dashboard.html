<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Pro — ProConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .pro-tabs { display: flex; gap: 8px; margin-bottom: 24px; background: var(--bg-card); padding: 6px; border-radius: 12px; border: 1px solid var(--border); width: fit-content; flex-wrap: wrap; }
    .pro-tab { padding: 10px 20px; border-radius: 8px; cursor: pointer; color: var(--text-secondary); font-weight: 600; transition: all 0.2s; }
    .pro-tab.active { background: var(--primary); color: white; }
    .pro-tab:not(.active):hover { color: var(--text-primary); }
    .request-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 14px; }
    .btn-confirm { background: var(--green); color: white; }
    .btn-reject { background: transparent; border: 1px solid var(--red); color: var(--red); }
    .btn-disabled { background: var(--bg-surface); color: var(--text-muted); cursor: not-allowed; opacity: 0.6; }
    .status-badge { display: inline-flex; padding: 4px 12px; border-radius: 100px; font-size: 12px; font-weight: 600; }
    .status-pending { background: rgba(245, 158, 11, 0.15); color: var(--orange); }
    .status-confirmed { background: rgba(16, 185, 129, 0.15); color: var(--green); }
    .status-cancelled { background: rgba(239, 68, 68, 0.15); color: var(--red); }
    .status-completed { background: rgba(59, 130, 246, 0.15); color: #60A5FA; }
    .availability-toggle { background: var(--bg-card); border: 1px solid var(--border); border-radius: 24px; padding: 60px 40px; text-align: center; max-width: 500px; margin: 40px auto; }
    .stats-grid-pro { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card-pro { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 16px; position: relative; overflow: hidden; transition: all 0.3s; }
    .stat-card-pro:hover { transform: translateY(-4px); border-color: var(--primary); }
    .stat-card-pro::before { content: ''; position: absolute; top: 0; right: 0; width: 80px; height: 80px; border-radius: 50%; background: var(--stat-color); opacity: 0.1; transform: translate(20px, -20px); }
    .stat-icon-pro { width: 44px; height: 44px; border-radius: 12px; background: var(--stat-color); display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; margin-bottom: 12px; }
    .stat-value-pro { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
    .stat-label-pro { color: var(--text-secondary); font-size: 13px; }
    .stat-trend { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; margin-top: 8px; }
    .trend-up { color: var(--green); }
    .trend-down { color: var(--red); }
    .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 24px; }
    .chart-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .chart-title { font-size: 16px; font-weight: 700; }
    .chart-canvas-wrapper { position: relative; height: 280px; }
    .quick-load { animation: fadeIn 0.3s ease-out; }
    .profile-form { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; max-width: 700px; margin: 0 auto; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
    .toast-success { position: fixed; bottom: 30px; right: 30px; background: var(--green); color: white; padding: 16px 24px; border-radius: 12px; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4); z-index: 9999; animation: slideInRight 0.3s ease-out; display: flex; align-items: center; gap: 12px; font-weight: 600; }
    @keyframes slideInRight { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @media (max-width: 968px) { .charts-grid { grid-template-columns: 1fr; } .stats-grid-pro { grid-template-columns: 1fr 1fr; } .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo" onclick="location.href='index.html'">ProConnect</div>
    <div class="nav-links" id="navLinks"></div>
  </nav>

  <main class="main">
    <a href="index.html" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Retour à l'accueil
    </a>

    <div id="header" style="min-height: 90px;"></div>

    <div class="pro-tabs" id="proTabs">
      <div class="pro-tab active" data-tab="dashboard" onclick="switchTab('dashboard')">📊 Dashboard</div>
      <div class="pro-tab" data-tab="requests" onclick="switchTab('requests')">🔔 Demandes</div>
      <div class="pro-tab" data-tab="profile" onclick="switchTab('profile')">👤 Mon Profil</div>
      <div class="pro-tab" data-tab="availability" onclick="switchTab('availability')">⚙️ Disponibilité</div>
    </div>

    <div id="tabContent">
      <div style="text-align: center; padding: 40px; color: var(--text-muted);">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 12px;"></i>
        <p>Chargement de ton dashboard...</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    let currentUser = null;
    let proData = null;
    let currentTab = 'dashboard';
    let charts = {};
    let cachedBookings = null;
    let cachedReviews = null;

    const cityCoords = {
      'Tizi Ouzou': [36.7117, 4.0500], 'Aïn El Hammam': [36.5667, 4.3000],
      'Larbaâ Nath Irathen': [36.6333, 4.2000], 'Beni Yenni': [36.6167, 4.2500],
      'Azazga': [36.5167, 4.6833], 'Tigzirt': [36.8908, 4.1217],
      'Azeffoun': [36.8939, 4.4253], 'Bouzeguène': [36.6500, 4.5167],
      'Boghni': [36.5333, 3.9500], 'Ouadhias': [36.4833, 4.0833],
      'Béni Douala': [36.6333, 4.0500], 'Draâ Ben Khedda': [36.6500, 4.1500],
      'Béjaïa': [36.7558, 5.0840], 'Akbou': [36.4567, 4.5419],
      'Aokas': [36.6383, 5.2503], 'El Kseur': [36.6803, 4.8567],
      'Sidi Aïch': [36.6111, 4.6889], 'Tazmalt': [36.3667, 4.4167],
      'Bouira': [36.3736, 3.9019], 'Lakhdaria': [36.5667, 3.6833],
      "M'Chedallah": [36.3833, 4.3000], 'Aïn Bessem': [36.3000, 3.6667],
      'Alger': [36.7372, 3.0865], 'Blida': [36.4203, 2.8277],
      'Boumerdès': [36.7669, 3.4778], 'Bordj Menaiel': [36.4564, 4.1839],
      'Tipaza': [36.5944, 2.4475], 'Médéa': [36.2654, 2.7539],
      'Aïn Defla': [36.2647, 1.9678], 'Djelfa': [34.6753, 3.2547],
      'Constantine': [36.3650, 6.6147], 'Annaba': [36.9000, 7.7667],
      'Sétif': [36.1900, 5.4133], 'Batna': [35.5559, 6.1741],
      'El Eulma': [36.1500, 5.6833], 'Bordj Bou Arréridj': [36.0731, 4.7608],
      'Skikda': [36.8758, 6.9094], 'Souk Ahras': [36.2867, 7.9511],
      'Guelma': [36.4625, 7.4283], 'Khenchela': [35.4358, 7.1408],
      'Tébessa': [35.4044, 8.1242], 'Biskra': [34.8500, 5.7333],
      'Oran': [35.6976, -0.6337], 'Tlemcen': [34.8783, -1.3150],
      'Sidi Bel Abbès': [35.1878, -0.6308], 'Mostaganem': [35.9314, 0.0894],
      'Mascara': [35.3964, 0.1411], 'Relizane': [35.7372, 0.5556],
      'Aïn Témouchent': [35.2978, -1.1408], 'Tiaret': [35.3705, 1.3170],
      'Chlef': [36.1656, 1.3344], 'Saïda': [34.8303, 0.1517],
      'Ghardaïa': [32.4847, 3.6736], 'El Oued': [33.3683, 6.8675],
      'Béchar': [31.6177, -2.2167]
    };

    const statusLabels = {
      pending: { label: '⏳ En attente', class: 'status-pending' },
      confirmed: { label: '✓ Confirmée', class: 'status-confirmed' },
      cancelled: { label: '✗ Refusée', class: 'status-cancelled' },
      completed: { label: '✓ Terminée', class: 'status-completed' },
    };

    function safeName(name, fallback = 'Utilisateur') {
      if (!name || typeof name !== 'string') return fallback;
      const cleaned = name.trim();
      return cleaned || fallback;
    }

    function safeInitial(name) {
      const n = safeName(name, '?');
      return n[0].toUpperCase();
    }

    function showToast(message, type = 'success') {
      const existing = document.querySelector('.toast-success');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast-success';
      const icon = type === 'error' ? 'fa-circle-xmark' : 'fa-check-circle';
      if (type === 'error') toast.style.background = 'var(--red)';
      toast.innerHTML = `<i class="fa-solid ${icon}"></i> ${message}`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    async function enrichBookingsWithNames(bookings) {
      const missingClientIds = [...new Set(bookings.filter(b => !b.client_name && b.client_id).map(b => b.client_id))];
      if (missingClientIds.length === 0) return bookings;

      const { data: clients } = await db.from('users').select('id, name').in('id', missingClientIds);
      const clientMap = Object.fromEntries((clients || []).map(c => [c.id, c.name]));

      const updates = [];
      bookings.forEach(b => {
        if (!b.client_name && clientMap[b.client_id]) {
          b.client_name = clientMap[b.client_id];
          updates.push(db.from('bookings').update({ client_name: clientMap[b.client_id] }).eq('id', b.id));
        }
      });
      if (updates.length > 0) {
        Promise.all(updates).catch(err => console.error('Auto-repair client_name:', err));
      }
      return bookings;
    }

    async function autoCancelExpiredBookings() {
      const now = new Date();
      const expired = cachedBookings.filter(b => 
        b.status === 'pending' && new Date(b.date_time) < now
      );
      if (expired.length === 0) return;

      const ids = expired.map(b => b.id);
      const { error } = await db.from('bookings').update({ status: 'cancelled' }).in('id', ids);
      if (error) {
        console.error('Erreur auto-cancel:', error);
        return;
      }

      expired.forEach(b => {
        const idx = cachedBookings.findIndex(x => x.id === b.id);
        if (idx !== -1) cachedBookings[idx].status = 'cancelled';

        if (b.client_id) {
          db.from('notifications').insert({
            user_id: b.client_id,
            title: '⏰ Réservation expirée',
            message: `Votre réservation avec ${safeName(b.pro_name, 'le professionnel')} n'a pas été confirmée à temps et a été automatiquement annulée.`,
            type: 'warning',
            link: 'profile.html'
          }).then(() => {});
        }
      });
    }

    async function init() {
      currentUser = await requireAuth();
      if (!currentUser) return;

      if (currentUser.role !== 'professional') {
        showToast('Cette page est réservée aux professionnels', 'error');
        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        return;
      }

      const { data: proResList, error: proError } = await db.from('professionals')
        .select('*').eq('user_id', currentUser.id);

      if (proError) {
        console.error('Erreur chargement profil pro:', proError);
      }

      const proRes = (proResList && proResList.length > 0) ? proResList[0] : null;

      if (!proRes) {
        document.getElementById('proTabs').style.display = 'none';
        document.getElementById('header').innerHTML = `
          <div style="background: var(--bg-card); border: 1px solid var(--orange); border-radius: 16px; padding: 40px; text-align: center; margin-bottom: 24px;">
            <i class="fa-solid fa-triangle-exclamation" style="font-size: 56px; color: var(--orange); margin-bottom: 20px;"></i>
            <h2 style="margin-bottom: 12px; font-size: 24px;">Profil professionnel introuvable</h2>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">Contacte l'administrateur ou crée un nouveau compte pro.</p>
            <a href="register.html?role=pro" class="btn btn-primary"><i class="fa-solid fa-user-plus"></i> Créer un compte pro</a>
            <a href="index.html" class="btn btn-secondary" style="margin-left: 10px;"><i class="fa-solid fa-arrow-left"></i> Accueil</a>
          </div>
        `;
        document.getElementById('tabContent').innerHTML = '';
        return;
      }

      proData = proRes;
      renderHeader();

      const proIds = (proResList || []).map(p => p.id);

      const [bookingsRes, reviewsRes] = await Promise.all([
        db.from('bookings').select('*').in('professional_id', proIds).order('created_at', { ascending: false }),
        db.from('reviews').select('rating').in('professional_id', proIds)
      ]);

      cachedBookings = bookingsRes.data || [];
      cachedReviews = reviewsRes.data || [];

      await enrichBookingsWithNames(cachedBookings);
      await autoCancelExpiredBookings();

      renderDashboard();

      db.channel('pro-bookings')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings', filter: `professional_id=eq.${proData.id}` },
          async () => {
            const { data } = await db.from('bookings').select('*').in('professional_id', proIds).order('created_at', { ascending: false });
            cachedBookings = data || [];
            await enrichBookingsWithNames(cachedBookings);
            if (currentTab === 'dashboard') renderDashboard();
            if (currentTab === 'requests') renderRequests();
          })
        .subscribe();
    }

    function renderHeader() {
      const firstName = safeName(currentUser.name).split(' ')[0];
      document.getElementById('header').innerHTML = `
        <div class="quick-load" style="display: flex; align-items: center; gap: 20px; margin-bottom: 32px;">
          <div style="width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--cyan)); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; color: white;">
            ${safeInitial(currentUser.name)}
          </div>
          <div>
            <h1 style="font-size: 28px; font-weight: 800;">Bonjour ${firstName} 👋</h1>
            <p style="color: var(--text-secondary);">${safeName(proData.job, 'Métier non défini')} • ${safeName(proData.city, 'Ville non définie')}</p>
          </div>
        </div>
      `;
    }

    async function switchTab(tab) {
      if (!proData) return;
      currentTab = tab;
      document.querySelectorAll('.pro-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

      Object.values(charts).forEach(c => c.destroy());
      charts = {};

      if (tab === 'dashboard') renderDashboard();
      if (tab === 'requests') renderRequests();
      if (tab === 'profile') renderProfile();
      if (tab === 'availability') renderAvailability();
    }

    function renderDashboard() {
      if (!cachedBookings) return;
      const bookings = cachedBookings;
      const reviews = cachedReviews || [];

      const stats = {
        total: bookings.length,
        pending: bookings.filter(b => b.status === 'pending').length,
        confirmed: bookings.filter(b => b.status === 'confirmed').length,
        completed: bookings.filter(b => b.status === 'completed').length,
        cancelled: bookings.filter(b => b.status === 'cancelled').length,
      };

      const revenue = stats.completed * (proData.price_per_hour || 0) * 2;
      const acceptanceRate = stats.total > 0 ? Math.round(((stats.confirmed + stats.completed) / stats.total) * 100) : 0;
      const avgRating = reviews.length > 0 
        ? (reviews.reduce((s, r) => s + r.rating, 0) / reviews.length).toFixed(1)
        : '0.0';

      document.getElementById('tabContent').innerHTML = `
        <div class="stats-grid-pro quick-load">
          <div class="stat-card-pro" style="--stat-color: var(--primary);">
            <div class="stat-icon-pro"><i class="fa-solid fa-calendar-check"></i></div>
            <div class="stat-value-pro">${stats.total}</div>
            <div class="stat-label-pro">Total demandes</div>
            <div class="stat-trend trend-up"><i class="fa-solid fa-arrow-up"></i> +12% ce mois</div>
          </div>
          <div class="stat-card-pro" style="--stat-color: var(--green);">
            <div class="stat-icon-pro"><i class="fa-solid fa-check-double"></i></div>
            <div class="stat-value-pro">${acceptanceRate}%</div>
            <div class="stat-label-pro">Taux d'acceptation</div>
            <div class="stat-trend trend-up"><i class="fa-solid fa-arrow-up"></i> Excellent</div>
          </div>
          <div class="stat-card-pro" style="--stat-color: var(--orange);">
            <div class="stat-icon-pro"><i class="fa-solid fa-coins"></i></div>
            <div class="stat-value-pro">${revenue.toLocaleString()}</div>
            <div class="stat-label-pro">Revenus estimés (DA)</div>
            <div class="stat-trend trend-up"><i class="fa-solid fa-arrow-up"></i> +24%</div>
          </div>
          <div class="stat-card-pro" style="--stat-color: var(--cyan);">
            <div class="stat-icon-pro"><i class="fa-solid fa-star"></i></div>
            <div class="stat-value-pro">${avgRating}/5</div>
            <div class="stat-label-pro">Note moyenne</div>
            <div class="stat-trend trend-up"><i class="fa-solid fa-arrow-up"></i> ${reviews.length} avis</div>
          </div>
        </div>

        <div class="charts-grid quick-load">
          <div class="chart-card">
            <div class="chart-header"><h3 class="chart-title">📈 Évolution des demandes (12 derniers mois)</h3></div>
            <div class="chart-canvas-wrapper"><canvas id="evolutionChart"></canvas></div>
          </div>
          <div class="chart-card">
            <div class="chart-header"><h3 class="chart-title">🎯 Répartition des statuts</h3></div>
            <div class="chart-canvas-wrapper"><canvas id="statusChart"></canvas></div>
          </div>
        </div>

        <div class="charts-grid quick-load">
          <div class="chart-card">
            <div class="chart-header"><h3 class="chart-title">⏰ Heures les plus demandées</h3></div>
            <div class="chart-canvas-wrapper"><canvas id="hoursChart"></canvas></div>
          </div>
          <div class="chart-card">
            <div class="chart-header"><h3 class="chart-title">📅 Jours les plus actifs</h3></div>
            <div class="chart-canvas-wrapper"><canvas id="daysChart"></canvas></div>
          </div>
        </div>

        <h2 style="font-size: 22px; margin-bottom: 16px;">📋 Dernières demandes</h2>
        ${bookings.slice(0, 5).map(b => `
          <div class="request-card">
            <div style="display: flex; justify-content: space-between;">
              <div>
                <h3>Demande de ${safeName(b.client_name, 'Client inconnu')}</h3>
                <p style="color: var(--text-secondary); font-size: 14px;">
                  ${new Date(b.date_time).toLocaleDateString('fr-FR')} à 
                  ${new Date(b.date_time).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}
                </p>
              </div>
              <span class="status-badge ${statusLabels[b.status].class}">${statusLabels[b.status].label}</span>
            </div>
          </div>
        `).join('') || '<p style="color: var(--text-muted)">Aucune demande</p>'}
      `;

      requestAnimationFrame(() => createCharts(bookings));
    }

    function createCharts(bookings) {
      Chart.defaults.color = '#94A3B8';
      Chart.defaults.borderColor = '#2A3050';
      Chart.defaults.font.family = 'Inter, sans-serif';

      const months = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin', 'Juil', 'Aoû', 'Sep', 'Oct', 'Nov', 'Déc'];
      const now = new Date();
      const monthlyData = Array(12).fill(0);
      
      bookings.forEach(b => {
        const date = new Date(b.created_at);
        const monthDiff = (now.getFullYear() - date.getFullYear()) * 12 + (now.getMonth() - date.getMonth());
        if (monthDiff >= 0 && monthDiff < 12) monthlyData[11 - monthDiff]++;
      });

      const labels12 = [];
      for (let i = 11; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        labels12.push(months[d.getMonth()]);
      }

      const ctx1 = document.getElementById('evolutionChart');
      if (ctx1) {
        charts.evolution = new Chart(ctx1, {
          type: 'line',
          data: { labels: labels12, datasets: [{ label: 'Demandes', data: monthlyData, borderColor: '#7C3AED', backgroundColor: 'rgba(124, 58, 237, 0.1)', fill: true, tension: 0.4, pointBackgroundColor: '#7C3AED', pointBorderColor: '#fff', pointBorderWidth: 2, pointRadius: 5 }] },
          options: { responsive: true, maintainAspectRatio: false, animation: { duration: 600 }, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#2A3050' } }, x: { grid: { display: false } } } }
        });
      }

      const statusData = {
        'En attente': bookings.filter(b => b.status === 'pending').length,
        'Confirmées': bookings.filter(b => b.status === 'confirmed').length,
        'Terminées': bookings.filter(b => b.status === 'completed').length,
        'Refusées': bookings.filter(b => b.status === 'cancelled').length
      };

      const ctx2 = document.getElementById('statusChart');
      if (ctx2) {
        charts.status = new Chart(ctx2, {
          type: 'doughnut',
          data: { labels: Object.keys(statusData), datasets: [{ data: Object.values(statusData), backgroundColor: ['#F59E0B', '#10B981', '#60A5FA', '#EF4444'], borderWidth: 0 }] },
          options: { responsive: true, maintainAspectRatio: false, animation: { duration: 600 }, plugins: { legend: { position: 'bottom', labels: { padding: 12, font: { size: 11 } } } } }
        });
      }

      const hoursData = Array(24).fill(0);
      bookings.forEach(b => { hoursData[new Date(b.date_time).getHours()]++; });

      const ctx3 = document.getElementById('hoursChart');
      if (ctx3) {
        charts.hours = new Chart(ctx3, {
          type: 'bar',
          data: { labels: Array.from({length: 24}, (_, i) => `${i}h`), datasets: [{ label: 'Demandes', data: hoursData, backgroundColor: 'rgba(6, 182, 212, 0.6)', borderColor: '#06B6D4', borderWidth: 2, borderRadius: 6 }] },
          options: { responsive: true, maintainAspectRatio: false, animation: { duration: 600 }, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#2A3050' } }, x: { grid: { display: false } } } }
        });
      }

      const days = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
      const daysData = Array(7).fill(0);
      bookings.forEach(b => { daysData[new Date(b.date_time).getDay()]++; });

      const ctx4 = document.getElementById('daysChart');
      if (ctx4) {
        charts.days = new Chart(ctx4, {
          type: 'radar',
          data: { labels: days, datasets: [{ label: 'Demandes', data: daysData, backgroundColor: 'rgba(245, 158, 11, 0.2)', borderColor: '#F59E0B', borderWidth: 2, pointBackgroundColor: '#F59E0B', pointRadius: 4 }] },
          options: { responsive: true, maintainAspectRatio: false, animation: { duration: 600 }, plugins: { legend: { display: false } }, scales: { r: { beginAtZero: true, grid: { color: '#2A3050' }, angleLines: { color: '#2A3050' }, pointLabels: { font: { size: 12 } } } } }
        });
      }
    }

    function renderRequests() {
      const bookings = cachedBookings || [];
      const sorted = [...bookings].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      const now = new Date();

      document.getElementById('tabContent').innerHTML = `
        <h2 style="font-size: 22px; margin-bottom: 20px;">🔔 Toutes les demandes</h2>
        ${sorted.length === 0 ? `
          <div style="text-align: center; padding: 60px; color: var(--text-muted)">
            <i class="fa-solid fa-bell-slash" style="font-size: 40px; opacity: 0.5; margin-bottom: 16px;"></i>
            <p>Aucune demande pour l'instant</p>
          </div>
        ` : sorted.map(b => {
          const bookingDate = new Date(b.date_time);
          const isPassed = bookingDate <= now;
          const clientName = safeName(b.client_name, 'Client inconnu');
          return `
          <div class="request-card quick-load">
            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
              <div style="display: flex; gap: 12px; align-items: center;">
                <div style="width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--cyan), var(--primary)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700;">
                  ${safeInitial(b.client_name)}
                </div>
                <div>
                  <h3 style="font-size: 17px;">Demande de ${clientName}</h3>
                  <p style="color: var(--text-secondary); font-size: 13px; margin-top: 4px;">
                    <i class="fa-solid fa-calendar"></i> ${bookingDate.toLocaleDateString('fr-FR')}
                    <span style="margin-left: 12px;"><i class="fa-solid fa-clock"></i> ${bookingDate.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}</span>
                  </p>
                </div>
              </div>
              <span class="status-badge ${statusLabels[b.status].class}">${statusLabels[b.status].label}</span>
            </div>
            ${b.note ? `<p style="padding: 10px; background: var(--bg-surface); border-radius: 8px; font-size: 14px; margin-bottom: 12px;">📝 ${b.note}</p>` : ''}
            ${b.status === 'pending' ? `
              <div style="display: flex; gap: 10px;">
                <button onclick="updateStatus('${b.id}', 'cancelled')" class="btn btn-reject" style="flex: 1;"><i class="fa-solid fa-xmark"></i> Refuser</button>
                <button onclick="updateStatus('${b.id}', 'confirmed')" class="btn btn-confirm" style="flex: 1;"><i class="fa-solid fa-check"></i> Confirmer</button>
              </div>
            ` : ''}
            ${(b.status === 'pending' || b.status === 'confirmed') ? `
              <a href="chat.html?booking=${b.id}" class="btn btn-secondary btn-block" style="margin-top: 10px;"><i class="fa-solid fa-comments"></i> Discuter avec ${clientName}</a>
            ` : ''}
            ${b.status === 'confirmed' ? (isPassed ? `
              <button onclick="updateStatus('${b.id}', 'completed')" class="btn btn-primary btn-block" style="margin-top: 10px;"><i class="fa-solid fa-check-double"></i> Marquer comme terminée</button>
            ` : `
              <button class="btn btn-disabled btn-block" style="margin-top: 10px;" disabled title="Tu pourras marquer cette prestation comme terminée après la date prévue">
                <i class="fa-solid fa-lock"></i> Disponible le ${bookingDate.toLocaleDateString('fr-FR')} à ${bookingDate.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}
              </button>
            `) : ''}
          </div>
        `;
        }).join('')}
      `;
    }

    function renderProfile() {
      const cities = Object.keys(cityCoords).sort();
      const jobs = [
        'Plomberie', 'Électricité', 'Ménage', 'Jardinage', 'Peinture',
        'Informatique', 'Mécanique', 'Maçonnerie', 'Menuiserie', 'Climatisation',
        'Transport & Livraison', 'Déménagement', 'Coiffure', 'Esthétique', 'Cuisine', 'Vitrerie'
      ];

      document.getElementById('tabContent').innerHTML = `
        <div class="profile-form quick-load">
          <h2 style="font-size: 22px; margin-bottom: 8px;">👤 Mon Profil</h2>
          <p style="color: var(--text-secondary); margin-bottom: 28px;">Modifie tes informations professionnelles</p>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Métier principal</label>
              <select id="editJob" class="form-select">
                ${jobs.map(j => `<option ${j === proData.job ? 'selected' : ''}>${j}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Ville</label>
              <select id="editCity" class="form-select">
                ${cities.map(c => `<option ${c === proData.city ? 'selected' : ''}>${c}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Tarif horaire (DA)</label>
              <input type="number" id="editPrice" class="form-input" value="${proData.price_per_hour || ''}" placeholder="1500">
            </div>
            <div class="form-group">
              <label class="form-label">Véhicule</label>
              <select id="editVehicle" class="form-select">
                <option value="true" ${proData.has_vehicle ? 'selected' : ''}>🚗 Oui, je peux me déplacer</option>
                <option value="false" ${!proData.has_vehicle ? 'selected' : ''}>❌ Non</option>
              </select>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 18px;">
            <label class="form-label">Description / Bio</label>
            <textarea id="editBio" class="form-input" rows="4" placeholder="Décris ton expérience, tes spécialités...">${proData.bio || ''}</textarea>
          </div>

          <button onclick="saveProfile()" class="btn btn-primary btn-block" id="saveBtn">
            <i class="fa-solid fa-save"></i> Enregistrer les modifications
          </button>
        </div>
      `;
    }

    function renderAvailability() {
      const isAvailable = proData.is_available;
      document.getElementById('tabContent').innerHTML = `
        <div class="availability-toggle quick-load">
          <i class="fa-solid fa-${isAvailable ? 'check-circle' : 'circle-xmark'}" 
             style="font-size: 80px; color: ${isAvailable ? 'var(--green)' : 'var(--red)'}; margin-bottom: 24px;"></i>
          <h2 style="font-size: 28px; margin-bottom: 12px;">Tu es ${isAvailable ? 'disponible' : 'indisponible'}</h2>
          <p style="color: var(--text-secondary); margin-bottom: 32px;">
            ${isAvailable ? 'Les clients peuvent te voir et te réserver' : 'Tu n\'apparais pas dans les recherches'}
          </p>
          <button onclick="toggleAvailability()" class="btn ${isAvailable ? 'btn-reject' : 'btn-confirm'}">
            ${isAvailable ? 'Me marquer indisponible' : 'Me marquer disponible'}
          </button>
        </div>
      `;
    }

    async function updateStatus(id, status) {
      const booking = cachedBookings.find(b => b.id === id);
      if (!booking) {
        showToast('Réservation introuvable', 'error');
        return;
      }

      if (status === 'completed') {
        const bookingDate = new Date(booking.date_time);
        if (bookingDate > new Date()) {
          showToast('Tu ne peux marquer comme terminée qu\'après la date prévue', 'error');
          return;
        }
      }

      const { error } = await db.from('bookings').update({ status }).eq('id', id);
      if (error) {
        showToast('Erreur lors de la mise à jour', 'error');
        return;
      }

      const idx = cachedBookings.findIndex(b => b.id === id);
      if (idx !== -1) cachedBookings[idx].status = status;

      const messages = {
        'confirmed': 'Demande confirmée',
        'cancelled': 'Demande refusée',
        'completed': 'Service terminé avec succès'
      };
      showToast(messages[status] || 'Statut mis à jour');

      if (status === 'completed' && booking.client_id) {
        await db.from('notifications').insert({
          user_id: booking.client_id,
          title: '✓ Prestation terminée',
          message: `${safeName(proData.name, 'Le professionnel')} a marqué votre prestation comme terminée. N'oubliez pas de laisser un avis !`,
          type: 'success',
          link: 'profile.html'
        });
      }

      renderRequests();
    }

    async function saveProfile() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Enregistrement...';

      const job = document.getElementById('editJob').value;
      const city = document.getElementById('editCity').value;
      const price = parseFloat(document.getElementById('editPrice').value) || null;
      const hasVehicle = document.getElementById('editVehicle').value === 'true';
      const bio = document.getElementById('editBio').value.trim();
      const coords = cityCoords[city] || [proData.latitude, proData.longitude];

      const { error } = await db.from('professionals').update({
        job, city, price_per_hour: price, has_vehicle: hasVehicle,
        bio, latitude: coords[0], longitude: coords[1]
      }).eq('id', proData.id);

      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-save"></i> Enregistrer les modifications';

      if (error) {
        showToast('Erreur lors de la mise à jour', 'error');
        return;
      }

      Object.assign(proData, { job, city, price_per_hour: price, has_vehicle: hasVehicle, bio, latitude: coords[0], longitude: coords[1] });
      renderHeader();
      showToast('Profil mis à jour avec succès');
    }

    async function toggleAvailability() {
      const newVal = !proData.is_available;
      const { error } = await db.from('professionals').update({ is_available: newVal }).eq('id', proData.id);
      if (error) {
        showToast('Erreur lors de la mise à jour', 'error');
        return;
      }
      proData.is_available = newVal;
      renderAvailability();
      showToast(newVal ? 'Tu es maintenant disponible' : 'Tu es maintenant indisponible');
    }

    init();
  </script>
</body>
</html>
