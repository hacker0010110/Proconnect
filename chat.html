<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat — ProConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .chat-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      height: 75vh;
      min-height: 500px;
      overflow: hidden;
    }
    .chat-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg-surface);
    }
    .chat-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: white;
      font-size: 20px;
    }
    .chat-header-info h3 { font-size: 18px; }
    .chat-header-info p { font-size: 13px; color: var(--text-secondary); }
    .chat-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--green);
    }
    .chat-status::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 16px;
      animation: fadeIn 0.3s ease-out;
      word-break: break-word;
    }
    .message-sent {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message-received {
      align-self: flex-start;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .message-time {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 4px;
    }
    .chat-input {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg-surface);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .chat-input input {
      flex: 1;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 100px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }
    .chat-input input:focus { border-color: var(--primary); }
    .send-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .send-btn:hover {
      transform: scale(1.1);
    }
    .empty-chat {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }
    .booking-info {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    @media (max-width: 768px) {
      .chat-container { height: 80vh; }
      .message { max-width: 85%; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo" onclick="location.href='index.html'">ProConnect</div>
    <div class="nav-links" id="navLinks"></div>
  </nav>

  <main class="main">
    <a href="javascript:history.back()" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Retour
    </a>

    <div id="bookingInfo" class="booking-info" style="display: none;"></div>

    <div class="chat-container">
      <div class="chat-header" id="chatHeader">Chargement...</div>
      <div class="chat-messages" id="messages"></div>
      <form class="chat-input" onsubmit="sendMessage(event)">
        <input type="text" id="messageInput" placeholder="Écris ton message..." autocomplete="off" required>
        <button type="submit" class="send-btn">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    let currentUser = null;
    let booking = null;
    let otherUser = null;
    let messagesChannel = null;

    async function init() {
      currentUser = await requireAuth();
      if (!currentUser) return;

      const bookingId = new URLSearchParams(window.location.search).get('booking');
      if (!bookingId) {
        window.location.href = 'profile.html';
        return;
      }

      // Charge la réservation
      const { data: b } = await db.from('bookings').select('*').eq('id', bookingId).single();
      if (!b) {
        alert('Réservation introuvable');
        window.location.href = 'profile.html';
        return;
      }
      booking = b;

      // Détermine l'autre utilisateur (client ou pro)
      const isClient = currentUser.id === b.client_id;
      let otherUserId;
      
      if (isClient) {
        // Si je suis le client, l'autre c'est le pro
        const { data: pro } = await db.from('professionals').select('user_id').eq('id', b.professional_id).single();
        otherUserId = pro?.user_id;
      } else {
        // Si je suis le pro, l'autre c'est le client
        otherUserId = b.client_id;
      }

      if (otherUserId) {
        const { data: u } = await db.from('users').select('*').eq('id', otherUserId).single();
        otherUser = u;
      }

      renderHeader();
      renderBookingInfo();
      await loadMessages();
      subscribeRealtime();
    }

    function renderHeader() {
      const name = otherUser?.name || 'Utilisateur';
      const role = otherUser?.role === 'professional' ? 'Professionnel' : 'Client';
      document.getElementById('chatHeader').innerHTML = `
        <div class="chat-avatar">${name[0].toUpperCase()}</div>
        <div class="chat-header-info">
          <h3>${name}</h3>
          <p>${role} <span class="chat-status">En ligne</span></p>
        </div>
      `;
    }

    function renderBookingInfo() {
      const info = document.getElementById('bookingInfo');
      info.style.display = 'block';
      const statusColors = {
        pending: 'var(--orange)',
        confirmed: 'var(--green)',
        cancelled: 'var(--red)',
        completed: '#60A5FA'
      };
      const statusLabels = {
        pending: '⏳ En attente',
        confirmed: '✓ Confirmée',
        cancelled: '✗ Refusée',
        completed: '✓ Terminée'
      };
      info.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
          <div>
            <strong>📋 ${booking.job}</strong>
            <p style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">
              📅 ${new Date(booking.date_time).toLocaleDateString('fr-FR')} 
              à ${new Date(booking.date_time).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}
            </p>
          </div>
          <span style="padding: 6px 14px; border-radius: 100px; background: ${statusColors[booking.status]}20; color: ${statusColors[booking.status]}; font-size: 13px; font-weight: 600;">
            ${statusLabels[booking.status]}
          </span>
        </div>
      `;
    }

    async function loadMessages() {
      const { data: messages } = await db.from('messages')
        .select('*')
        .eq('booking_id', booking.id)
        .order('created_at', { ascending: true });

      renderMessages(messages || []);
    }

    function renderMessages(messages) {
      const container = document.getElementById('messages');
      
      if (messages.length === 0) {
        container.innerHTML = `
          <div class="empty-chat">
            <i class="fa-solid fa-comments" style="font-size: 50px; opacity: 0.3; margin-bottom: 16px;"></i>
            <p style="font-size: 16px; margin-bottom: 8px;">Aucun message pour le moment</p>
            <p style="font-size: 13px;">Commence la conversation !</p>
          </div>
        `;
        return;
      }

      container.innerHTML = messages.map(m => {
        const isSent = m.sender_id === currentUser.id;
        const time = new Date(m.created_at).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
        return `
          <div class="message ${isSent ? 'message-sent' : 'message-received'}">
            ${m.content}
            <div class="message-time">${time}</div>
          </div>
        `;
      }).join('');

      // Scroll en bas
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const content = input.value.trim();
      if (!content) return;

      input.value = '';
      input.disabled = true;

      try {
        await db.from('messages').insert({
          booking_id: booking.id,
          sender_id: currentUser.id,
          content
        });

        // Notifie l'autre utilisateur
        if (otherUser) {
          await db.from('notifications').insert({
            user_id: otherUser.id,
            title: '💬 Nouveau message',
            message: `${currentUser.name} : ${content.slice(0, 50)}${content.length > 50 ? '...' : ''}`,
            type: 'info',
            link: `chat.html?booking=${booking.id}`
          });
        }
      } catch (err) {
        alert('Erreur : ' + err.message);
      } finally {
        input.disabled = false;
        input.focus();
      }
    }

    function subscribeRealtime() {
      if (messagesChannel) db.removeChannel(messagesChannel);
      
      messagesChannel = db.channel(`chat-${booking.id}`)
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'messages',
          filter: `booking_id=eq.${booking.id}`
        }, () => loadMessages())
        .subscribe();
    }

    init();
  </script>
</body>
</html>
