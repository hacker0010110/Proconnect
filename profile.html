<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon profil — ProConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .profile-header {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.15) 0%, rgba(6, 182, 212, 0.15) 100%);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 32px;
    }
    .profile-avatar {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--cyan) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: 800; color: white;
    }
    .profile-name { font-size: 32px; font-weight: 800; margin-bottom: 4px; }
    .profile-email { color: var(--text-secondary); margin-bottom: 12px; }
    .profile-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--primary); color: white;
      padding: 6px 14px; border-radius: 100px;
      font-size: 13px; font-weight: 600;
    }
    .stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px;
    }
    .booking-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
    }
    .status-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 12px; border-radius: 100px;
      font-size: 12px; font-weight: 600;
    }
    .status-pending { background: rgba(245, 158, 11, 0.15); color: var(--orange); }
    .status-confirmed { background: rgba(16, 185, 129, 0.15); color: var(--green); }
    .status-cancelled { background: rgba(239, 68, 68, 0.15); color: var(--red); }
    .status-completed { background: rgba(59, 130, 246, 0.15); color: #60A5FA; }
    .btn-cancel-booking {
      background: transparent; border: 1px solid var(--red); color: var(--red);
    }
    .btn-cancel-booking:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      max-width: 500px;
      width: 100%;
      animation: fadeIn 0.3s ease-out;
    }
    .star-rating {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 20px 0;
    }
    .star-rating i {
      font-size: 36px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .star-rating i.active {
      color: var(--orange);
      transform: scale(1.1);
    }
    .star-rating i:hover {
      transform: scale(1.2);
    }
    .toast-success {
      position: fixed; bottom: 30px; right: 30px;
      background: var(--green); color: white;
      padding: 16px 24px; border-radius: 12px;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
      z-index: 9999; animation: slideInRight 0.3s ease-out;
      display: flex; align-items: center; gap: 12px;
      font-weight: 600;
    }
    @keyframes slideInRight {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo" onclick="location.href='index.html'">ProConnect</div>
        <div class="nav-links" id="navLinks"></div>
      </nav>

  <main class="main">
    <a href="index.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Retour à l'accueil
      </a>
    <div id="content">Chargement...</div>
  </main>

  <div class="modal-overlay" id="reviewModal">
    <div class="modal-content">
      <h2 style="font-size: 24px; margin-bottom: 8px;">Laisser un avis</h2>
      <p style="color: var(--text-secondary); margin-bottom: 16px;" id="modalProName"></p>
      
      <label style="font-size: 14px; color: var(--text-secondary);">Ta note :</label>
      <div class="star-rating" id="starRating">
        <i class="fa-solid fa-star" data-rating="1"></i>
        <i class="fa-solid fa-star" data-rating="2"></i>
        <i class="fa-solid fa-star" data-rating="3"></i>
        <i class="fa-solid fa-star" data-rating="4"></i>
        <i class="fa-solid fa-star" data-rating="5"></i>
      </div>

      <label style="font-size: 14px; color: var(--text-secondary);">Ton commentaire :</label>
      <textarea id="reviewComment" class="form-input" rows="4" placeholder="Partage ton expérience..." style="margin-top: 8px; margin-bottom: 20px;"></textarea>

      <div style="display: flex; gap: 12px;">
        <button onclick="closeReviewModal()" class="btn btn-secondary" style="flex: 1;">Annuler</button>
        <button onclick="submitReview()" class="btn btn-primary" style="flex: 1;">Envoyer l'avis</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="cancelModal">
    <div class="modal-content">
      <i class="fa-solid fa-triangle-exclamation" style="font-size: 48px; color: var(--orange); margin-bottom: 16px; display: block; text-align: center;"></i>
      <h2 style="font-size: 22px; margin-bottom: 12px; text-align: center;">Annuler cette réservation ?</h2>
      <p style="color: var(--text-secondary); margin-bottom: 24px; text-align: center;" id="cancelModalText">Confirmez-vous l'annulation de cette prestation ?</p>
      <div style="display: flex; gap: 12px;">
        <button onclick="closeCancelModal()" class="btn btn-secondary" style="flex: 1;">Non, garder</button>
        <button onclick="confirmCancelBooking()" class="btn btn-cancel-booking" style="flex: 1;"><i class="fa-solid fa-xmark"></i> Oui, annuler</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/realtime-notifs.js"></script>
  <script>
    let currentReview = { bookingId: null, proId: null, proName: '', rating: 0 };
    let bookingToCancelId = null;
    let cachedBookings = [];

    function safeName(name, fallback = 'Utilisateur') {
      if (!name || typeof name !== 'string') return fallback;
      const cleaned = name.trim();
      return cleaned || fallback;
    }

    function safeInitial(name) {
      const n = safeName(name, '?');
      return n[0].toUpperCase();
    }

    function showToast(message, type = 'success') {
      const existing = document.querySelector('.toast-success');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast-success';
      const icon = type === 'error' ? 'fa-circle-xmark' : 'fa-check-circle';
      if (type === 'error') toast.style.background = 'var(--red)';
      toast.innerHTML = `<i class="fa-solid ${icon}"></i> ${message}`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    async function autoCancelExpiredBookings(bookings) {
      const now = new Date();
      const expired = bookings.filter(b => 
        b.status === 'pending' && new Date(b.date_time) < now
      );
      if (expired.length === 0) return;

      const ids = expired.map(b => b.id);
      const { error } = await db.from('bookings').update({ status: 'cancelled' }).in('id', ids);
      if (error) {
        console.error('Erreur auto-cancel:', error);
        return;
      }

      expired.forEach(b => {
        b.status = 'cancelled';
        if (b.professional_id) {
          db.from('professionals').select('user_id').eq('id', b.professional_id).single().then(({ data: pro }) => {
            if (pro && pro.user_id) {
              db.from('notifications').insert({
                user_id: pro.user_id,
                title: '⏰ Réservation expirée',
                message: `Une réservation non confirmée à temps a été automatiquement annulée.`,
                type: 'warning',
                link: 'pro-dashboard.html'
              }).then(() => {});
            }
          });
        }
      });
    }

    async function loadProfile() {
      const user = await requireAuth();
      if (!user) return;

      if (user.role !== 'client') {
        showToast('Cette page est réservée aux clients', 'error');
        setTimeout(() => { window.location.href = 'pro-dashboard.html'; }, 1500);
        return;
      }

      const { data: bookings } = await db
        .from('bookings')
        .select('*')
        .eq('client_id', user.id)
        .order('created_at', { ascending: false });

      cachedBookings = bookings || [];

      await autoCancelExpiredBookings(cachedBookings);

      const { data: myReviews } = await db
        .from('reviews')
        .select('professional_id')
        .eq('client_id', user.id);
      const reviewedProIds = new Set(myReviews?.map(r => r.professional_id) || []);

      const stats = {
        total: cachedBookings.length,
        pending: cachedBookings.filter(b => b.status === 'pending').length,
        confirmed: cachedBookings.filter(b => b.status === 'confirmed').length,
        completed: cachedBookings.filter(b => b.status === 'completed').length,
      };

      const statusLabels = {
        pending: { label: '⏳ En attente', class: 'status-pending' },
        confirmed: { label: '✓ Confirmée', class: 'status-confirmed' },
        cancelled: { label: '✗ Refusée', class: 'status-cancelled' },
        completed: { label: '✓ Terminée', class: 'status-completed' },
      };

      const userName = safeName(user.name);
      const now = new Date();

      document.getElementById('content').innerHTML = `
        <div class="profile-header fade-in">
          <div class="profile-avatar">${safeInitial(user.name)}</div>
          <div>
            <h1 class="profile-name">${userName}</h1>
            <div class="profile-email">${user.email || ''}</div>
            <div class="profile-badge"><i class="fa-solid fa-user"></i> Client</div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value">${stats.total}</div>
            <div class="stat-label">Total</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" style="background: var(--orange); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">${stats.pending}</div>
            <div class="stat-label">En attente</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" style="background: var(--green); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">${stats.confirmed}</div>
            <div class="stat-label">Confirmées</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${stats.completed}</div>
            <div class="stat-label">Terminées</div>
          </div>
        </div>

        <h2 style="font-size: 24px; margin-bottom: 20px;">📅 Mes réservations</h2>
        ${cachedBookings.length === 0 ? `
          <div style="text-align: center; padding: 60px; color: var(--text-muted)">
            <i class="fa-solid fa-calendar" style="font-size: 40px; opacity: 0.5; margin-bottom: 16px;"></i>
            <p>Aucune réservation pour le moment</p>
            <a href="index.html" class="btn btn-primary" style="margin-top: 20px;">Réserver un pro</a>
          </div>
        ` : cachedBookings.map(b => {
          const bookingDate = new Date(b.date_time);
          const isFuture = bookingDate > now;
          const canCancel = (b.status === 'pending' || b.status === 'confirmed') && isFuture;
          const proName = safeName(b.pro_name, 'Professionnel inconnu');
          return `
          <div class="booking-card">
            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px;">
              <div>
                <h3 style="font-size: 18px; margin-bottom: 4px;">${proName}</h3>
                <p style="color: var(--text-secondary); font-size: 14px;">${safeName(b.job, '')}</p>
              </div>
              <span class="status-badge ${statusLabels[b.status].class}">${statusLabels[b.status].label}</span>
            </div>
            <div style="display: flex; gap: 16px; font-size: 14px; color: var(--text-secondary);">
              <span><i class="fa-solid fa-calendar"></i> ${bookingDate.toLocaleDateString('fr-FR')}</span>
              <span><i class="fa-solid fa-clock"></i> ${bookingDate.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}</span>
            </div>
            ${b.note ? `<p style="margin-top: 10px; padding: 10px; background: var(--bg-surface); border-radius: 8px; font-size: 14px;">📝 ${b.note}</p>` : ''}
            <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px;">
              ${b.status === 'completed' && !reviewedProIds.has(b.professional_id) ? `
                <button onclick="openReviewModal('${b.id}', '${b.professional_id}', '${proName.replace(/'/g, "\\'")}')" class="btn btn-primary">
                  <i class="fa-solid fa-star"></i> Laisser un avis
                </button>
              ` : ''}
              ${(b.status === 'pending' || b.status === 'confirmed') ? `
                <a href="chat.html?booking=${b.id}" class="btn btn-secondary">
                  <i class="fa-solid fa-comments"></i> Discuter
                </a>
              ` : ''}
              ${canCancel ? `
                <button onclick="openCancelModal('${b.id}')" class="btn btn-cancel-booking">
                  <i class="fa-solid fa-xmark"></i> Annuler
                </button>
              ` : ''}
            </div>
            ${b.status === 'completed' && reviewedProIds.has(b.professional_id) ? `
              <p style="margin-top: 12px; color: var(--green); font-size: 13px;">
                <i class="fa-solid fa-check-circle"></i> Avis déjà laissé
              </p>
            ` : ''}
          </div>
        `;
        }).join('')}
      `;

      db.channel('bookings-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings', filter: `client_id=eq.${user.id}` }, 
          () => loadProfile())
        .subscribe();
    }

    function openReviewModal(bookingId, proId, proName) {
      currentReview = { bookingId, proId, proName, rating: 0 };
      document.getElementById('modalProName').textContent = `Pour ${proName}`;
      document.getElementById('reviewComment').value = '';
      document.querySelectorAll('#starRating i').forEach(s => s.classList.remove('active'));
      document.getElementById('reviewModal').classList.add('show');
    }

    function closeReviewModal() {
      document.getElementById('reviewModal').classList.remove('show');
    }

    function openCancelModal(bookingId) {
      bookingToCancelId = bookingId;
      const booking = cachedBookings.find(b => b.id === bookingId);
      if (booking) {
        const proName = safeName(booking.pro_name, 'le professionnel');
        document.getElementById('cancelModalText').textContent = 
          `Confirmez-vous l'annulation de votre réservation avec ${proName} ?`;
      }
      document.getElementById('cancelModal').classList.add('show');
    }

    function closeCancelModal() {
      document.getElementById('cancelModal').classList.remove('show');
      bookingToCancelId = null;
    }

    async function confirmCancelBooking() {
      if (!bookingToCancelId) return;
      const id = bookingToCancelId;
      closeCancelModal();

      const booking = cachedBookings.find(b => b.id === id);
      if (!booking) {
        showToast('Réservation introuvable', 'error');
        return;
      }

      const { error } = await db.from('bookings').update({ status: 'cancelled' }).eq('id', id);
      if (error) {
        showToast('Erreur lors de l\'annulation', 'error');
        return;
      }

      await db.from('time_slots').delete().eq('booking_id', id);

      if (booking.professional_id) {
        const { data: pro } = await db.from('professionals').select('user_id, name').eq('id', booking.professional_id).maybeSingle();
        if (pro && pro.user_id) {
          const clientName = safeName(booking.client_name, 'Le client');
          await db.from('notifications').insert({
            user_id: pro.user_id,
            title: '✗ Réservation annulée',
            message: `${clientName} a annulé sa réservation du ${new Date(booking.date_time).toLocaleDateString('fr-FR')}`,
            type: 'warning',
            link: 'pro-dashboard.html'
          });
        }
      }

      showToast('Réservation annulée avec succès');
      loadProfile();
    }

    document.querySelectorAll('#starRating i').forEach(star => {
      star.addEventListener('click', (e) => {
        const rating = parseInt(e.target.dataset.rating);
        currentReview.rating = rating;
        document.querySelectorAll('#starRating i').forEach(s => {
          s.classList.toggle('active', parseInt(s.dataset.rating) <= rating);
        });
      });

      star.addEventListener('mouseenter', (e) => {
        const rating = parseInt(e.target.dataset.rating);
        document.querySelectorAll('#starRating i').forEach(s => {
          s.style.color = parseInt(s.dataset.rating) <= rating ? 'var(--orange)' : '';
        });
      });

      star.addEventListener('mouseleave', () => {
        document.querySelectorAll('#starRating i').forEach(s => {
          s.style.color = '';
        });
      });
    });

    async function submitReview() {
      if (currentReview.rating === 0) {
        showToast('Donne une note !', 'error');
        return;
      }
      const comment = document.getElementById('reviewComment').value.trim();
      if (!comment) {
        showToast('Écris un commentaire !', 'error');
        return;
      }

      const user = await getCurrentUser();
      if (!user) return;

      try {
        await db.from('reviews').insert({
          professional_id: currentReview.proId,
          client_id: user.id,
          client_name: safeName(user.name),
          rating: currentReview.rating,
          comment
        });

        const { data: allReviews } = await db
          .from('reviews')
          .select('rating')
          .eq('professional_id', currentReview.proId);
        
        const avg = allReviews.reduce((s, r) => s + r.rating, 0) / allReviews.length;
        
        await db.from('professionals').update({
          rating: avg,
          review_count: allReviews.length
        }).eq('id', currentReview.proId);

        const { data: pro } = await db.from('professionals')
          .select('user_id').eq('id', currentReview.proId).single();
        
        if (pro) {
          await db.from('notifications').insert({
            user_id: pro.user_id,
            title: '⭐ Nouvel avis reçu',
            message: `${safeName(user.name)} t'a laissé un avis ${currentReview.rating}/5`,
            type: 'success',
            link: 'pro-dashboard.html'
          });
        }

        closeReviewModal();
        showToast('Merci pour ton avis !');
        loadProfile();
      } catch (err) {
        showToast('Erreur : ' + err.message, 'error');
      }
    }

    loadProfile();
  </script>
</body>
</html>
