<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — ProConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo" onclick="location.href='index.html'">ProConnect</div>
        <div class="nav-links">
          <a href="index.html" class="back-link" style="margin: 0;">
            <i class="fa-solid fa-arrow-left"></i> Accueil
          </a>
          <a href="register.html" class="btn btn-secondary">S'inscrire</a>
        </div>
      </nav>
    

  <div class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">Bon retour ! 👋</h1>
      <p class="auth-subtitle">Connecte-toi pour accéder à ton espace</p>

      <div class="error-msg" id="errorMsg"></div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-input" placeholder="ton@email.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
          <span id="btnText">Se connecter</span>
        </button>
      </form>

      <div class="auth-footer">
        Pas encore de compte ? <a href="register.html">S'inscrire</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
